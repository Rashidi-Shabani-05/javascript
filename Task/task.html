<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first task</title>
    <link rel="stylesheet" href="style3.css">
    <script>
        function  sum(){
             let firstValue=Number(document.getElementById('num1').value);
             let secondValue=Number(document.getElementById('num2').value);
             let sum=firstValue+secondValue;
             document.getElementById('ans').value=sum;
        }
        function difference(){
             let firstValue=Number(document.getElementById('num1').value);
             let secondValue=Number(document.getElementById('num2').value);
             let difference=firstValue-secondValue;
             document.getElementById('ans').value=difference;
        }
        function multplication(){
             let firstValue=Number(document.getElementById('num1').value);
             let secondValue=Number(document.getElementById('num2').value);
             let multiplication=firstValue*secondValue;
             document.getElementById('ans').value=multiplication;
        } 
        function division(){
             let firstValue=Number(document.getElementById('num1').value);
             let secondValue=Number(document.getElementById('num2').value);
             // check for division by zero first
             if (secondValue === 0 ){
               document.getElementById('ans').value='Error (undefined)';
             } else {
               let division=firstValue/secondValue;
               document.getElementById('ans').value=division;
               }
        }
         function reset() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('ans').value = '';
        }
    </script>
</head>
<body>
    <div class="calculate">
    <h1>calculator</h1>
    <input type="number" id="num1" placeholder="Enter First Number"><br><br>
    <input type="number" id="num2" placeholder="Enter Second Number"><br><br>
    <button onclick="sum()">+</button>
    <button onclick="difference()">-</button>
    <button onclick="multplication()">x</button>
    <button onclick="division()">/</button><br><br>
    <input type="text" id="ans" placeholder="Answer"><br><br>
    <button onclick="reset()">reset</button>
    </div>
</body>
</html>
