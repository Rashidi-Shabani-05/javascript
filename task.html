<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first task</title>
    <script>
        function  sum(){
             let x=Number(document.getElementById('num1').value);
             let y=Number(document.getElementById('num2').value);
             let z1=x+y;
             document.getElementById('ans').value=z1;
        }
        function different(){
             let x=Number(document.getElementById('num1').value);
             let y=Number(document.getElementById('num2').value);
             let z2=x-y;
             document.getElementById('ans').value=z2;
        }
        function multplication(){
             let x=Number(document.getElementById('num1').value);
             let y=Number(document.getElementById('num2').value);
             let z3=x*y;
             document.getElementById('ans').value=z3;
        } 
        function division(){
             let x=Number(document.getElementById('num1').value);
             let y=Number(document.getElementById('num2').value);
             let z4=x/y;
             document.getElementById('ans').value=z4;
        }
         function reset() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('ans').value = '';
        }
    </script>
</head>
<body>
    <input type="number" id="num1"><br><br>
    <input type="number" id="num2"><br><br>
    <button onclick="sum()">+</button>
    <button onclick="different()">-</button>
    <button onclick="multplication()">x</button>
    <button onclick="division()">/</button><br><br>
    <input type="number" id="ans"><br><br>
    <button onclick="reset()">reset</button>
</body>
</html>
